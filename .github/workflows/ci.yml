name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --workspace --all-features
      - name: Test Overcenter adapter
        run: node --test adapters/overcenter/convert.test.mjs
      - name: Validate adapted evidence through Chirograph
        run: |
          node adapters/overcenter/convert.mjs \
            adapters/overcenter/fixtures/catalog.json \
            adapters/overcenter/fixtures/classifications.json \
            > /tmp/overcenter-evidence.json
          cargo run --quiet -p chirograph-cli -- inspect /tmp/overcenter-evidence.json
      - name: Install pinned Pydantic specimen
        run: python -m pip install 'pydantic @ git+https://github.com/pydantic/pydantic.git@001dea020e0809844e5b17666432c9135a976f46'
      - name: Test Pydantic specimen
        run: python -m unittest specimens/pydantic/test_specimen.py -v
