[workspace]
members = [
    "crates/chirograph-acquisition",
    "crates/chirograph-benchmark",
    "crates/chirograph-cli",
    "crates/chirograph-core",
    "crates/chirograph-go",
    "crates/chirograph-rust",
    "crates/chirograph-tree-sitter",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/laurajoyhutchins/chirograph"
license = "Apache-2.0"