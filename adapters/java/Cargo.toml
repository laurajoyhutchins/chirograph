[package]
name = "chirograph-java-adapter"
description = "Tree-sitter-backed Java acquisition adapter for Chirograph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
chirograph-core = { path = "../../crates/chirograph-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tree-sitter = "0.25"
tree-sitter-java = "0.23"
